schemaVersion: 1.2

endpoints:
  # The SSE endpoint — a long-lived Server-Sent Events connection on a
  # dedicated port with WriteTimeout/IdleTimeout disabled. Not on 8080
  # alongside a REST API because the REST listener's timeouts would kill
  # the connection. Mirrors apps/customer-portal/backend-v2's websocket
  # endpoint (WS_PORT, its own Choreo entry) for the same reason, though
  # this one is still a REST-style HTTP GET (Server-Sent Events), not a
  # protocol upgrade.
  - name: customer-portal-activity-stream
    displayName: Customer Portal Case Activity Stream
    service:
      basePath: /
      port: 9092
    type: REST
    networkVisibilities:
      - Public
    schemaFilePath: openapi.yaml

  # Health check endpoint on the same process but separate listener on
  # port 8080. Choreo's liveness probe targets this. SecurityHeaders +
  # CORS + CorrelationID + Logger middleware; Auth is NOT applied to
  # /health (see middleware.Auth).
  - name: customer-portal-activity-stream-service-health
    displayName: Customer Portal Case Activity Stream
    service:
      basePath: /
      port: 8080
    type: REST
    networkVisibilities:
      - Public
    schemaFilePath: openapi.yaml
